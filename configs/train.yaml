# 配置中的路径相对本 YAML 文件解析，命令行路径相对当前工作目录解析。
device: cpu
threads: 1
seed: 45
# 显式使用 synthetic 模式，每轮沿用原有策略训练的新实例生成流程。
# 使用固定数据时，设置 data_mode: npz，并添加 dataset_dir: ../data。
data_mode: synthetic
epochs: 150
train_instances: 256
batch_instances: 8
group_size: 8
val_size: 32
val_samples: 8
sample_chunk: 8
n_w: 3
n_s: 10
n_c: 100
embed_dim: 128
num_heads: 8
num_layers: 2
dynamic_context: true
lr: 0.0001
best_weight: 0.25
best_warmup_epochs: 2
entropy_weight: 0.002
reward_scale: 1000.0
penalty: 100000.0
output: ../checkpoints/path
